services:
  postgres:
    image: postgres:latest
    container_name: story-nest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-story_nest}
      POSTGRES_USER: ${POSTGRES_USER:-story_nest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-story_nest_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - story_nest_postgres_data:/var/lib/postgresql
      - ./backend/database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
      - ./backend/database/migrations/002_seed_sample_data.sql:/docker-entrypoint-initdb.d/002_seed_sample_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  story_nest_postgres_data:
